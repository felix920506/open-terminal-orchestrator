# Open WebUI with a per-chat terminal sandbox from Open Terminal Orchestrator.
#
#   cp .env.example .env    # then fill in the keys (see README.md)
#   docker compose up -d
#   open http://localhost:3000
#
# The terminal connection is pre-registered in Open WebUI through TERMINAL_SERVER_CONNECTIONS,
# so there is nothing to configure in the UI.

name: open-webui-terminals

services:
  open-webui:
    image: ${OPEN_WEBUI_IMAGE:-ghcr.io/open-webui/open-webui:v0.12.2}
    restart: unless-stopped
    depends_on:
      orchestrator:
        condition: service_healthy
    ports:
      - "${OPEN_WEBUI_PORT:-3000}:8080"
    environment:
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:?set WEBUI_SECRET_KEY in .env}
      OPENAI_API_BASE_URL: ${OPENAI_API_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Applied on first start only; afterwards Admin → Settings → Integrations is authoritative.
      TERMINAL_SERVER_CONNECTIONS: >-
        [{"id": "oto", "name": "Terminal", "enabled": true,
          "url": "http://orchestrator:8080", "path": "/openapi.json",
          "key": "${ORCH_API_KEY}", "auth_type": "bearer",
          "server_type": "orchestrator", "policy_id": "default",
          "config": {"contexts": {"chat": {"context_id": "chat_id"}},
                     "access_grants": [{"principal_type": "user", "principal_id": "*", "permission": "read"}]}}]
    volumes:
      - open-webui-data:/app/backend/data
    networks: [default, terminals]

  orchestrator:
    image: ${OTO_IMAGE:-ghcr.io/felix920506/open-terminal-orchestrator:0.1.5}
    # Fixed name: the orchestrator attaches itself to each sandbox's private network.
    container_name: oto-orchestrator
    restart: unless-stopped
    depends_on: [socket-proxy]
    environment:
      ORCH_API_KEY: ${ORCH_API_KEY:?set ORCH_API_KEY in .env}
      ORCH_ADMIN_API_KEY: ${ORCH_ADMIN_API_KEY:?set ORCH_ADMIN_API_KEY in .env}
      ORCH_SECRET_KEY: ${ORCH_SECRET_KEY:?set ORCH_SECRET_KEY in .env}
      ORCH_WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY}
      ORCH_DOCKER_HOST: tcp://socket-proxy:2375
      ORCH_SANDBOX_ACCESS: network
      ORCH_SELF_CONTAINER: oto-orchestrator
      # Image for the "default" policy. Pulled in the background when the orchestrator starts.
      ORCH_DEFAULT_IMAGE: ${SANDBOX_IMAGE:-ghcr.io/open-webui/open-terminal:latest}
      ORCH_IMAGE_ALLOWLIST: ghcr.io/open-webui/open-terminal*,ghcr.io/felix920506/open-terminal-scientific*
      ORCH_MAX_RUNNING_GLOBAL: ${MAX_RUNNING_SANDBOXES:-20}
      # Hold files attached before a chat's first message; needs the "Terminal uploads" filter.
      ORCH_STAGE_UPLOADS: ${STAGE_UPLOADS:-false}
      # Only Open WebUI (and `docker exec … oto` inside this container) may call the orchestrator.
      ORCH_ALLOWED_CLIENTS: open-webui,127.0.0.1
    volumes:
      - orchestrator-data:/data
    networks: [control, terminals]

  # Narrow Docker API access for the orchestrator; it never sees the raw socket.
  socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.4.2
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1
      VOLUMES: 1
      POST: 1
      DELETE: 1
      ALLOW_START: 1
      ALLOW_STOP: 1
      ALLOW_RESTARTS: 0
      EXEC: 0
      BUILD: 0
      SWARM: 0
      SECRETS: 0
      SYSTEM: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [control]

volumes:
  open-webui-data:
  orchestrator-data:

networks:
  # Open WebUI ↔ orchestrator. Internal: the orchestrator needs no internet access itself
  # (image pulls are done by the Docker daemon).
  terminals:
    internal: true
  # Orchestrator ↔ socket proxy.
  control:
    internal: true
