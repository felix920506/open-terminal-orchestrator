# Orchestrator + Docker socket proxy. Open WebUI connects to http://oto-orchestrator:8080
# (Admin → Integrations → Open Terminal; it is detected as "Orchestrator").
#
# The orchestrator joins each sandbox's private, internal network at runtime, so it must
# run with a fixed container name (ORCH_SELF_CONTAINER).

name: oto

services:
  socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.4.2
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1
      VOLUMES: 1
      POST: 1
      DELETE: 1
      ALLOW_START: 1
      ALLOW_STOP: 1
      ALLOW_RESTARTS: 0
      EXEC: 0
      BUILD: 0
      SWARM: 0
      SECRETS: 0
      SYSTEM: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [control]

  orchestrator:
    image: ${OTO_IMAGE:-open-terminal-orchestrator:latest}
    build: ..
    container_name: oto-orchestrator
    restart: unless-stopped
    depends_on: [socket-proxy]
    environment:
      ORCH_API_KEY: ${ORCH_API_KEY:?set ORCH_API_KEY}
      ORCH_ADMIN_API_KEY: ${ORCH_ADMIN_API_KEY:-}
      ORCH_SECRET_KEY: ${ORCH_SECRET_KEY:?set ORCH_SECRET_KEY}
      ORCH_DOCKER_HOST: tcp://socket-proxy:2375
      ORCH_SANDBOX_ACCESS: network
      ORCH_SELF_CONTAINER: oto-orchestrator
      ORCH_DEFAULT_IMAGE: ${ORCH_DEFAULT_IMAGE:-ghcr.io/open-webui/open-terminal:latest}
      ORCH_IMAGE_ALLOWLIST: ${ORCH_IMAGE_ALLOWLIST:-ghcr.io/open-webui/open-terminal*}
      ORCH_PULL_POLICY: ${ORCH_PULL_POLICY:-if-not-present}
      ORCH_MAX_RUNNING_GLOBAL: ${ORCH_MAX_RUNNING_GLOBAL:-50}
      ORCH_STAGE_UPLOADS: ${ORCH_STAGE_UPLOADS:-false}
      # Only these sources may call the orchestrator (IPs, CIDRs or hostnames such as the
      # Open WebUI container name). Empty allows any host that can reach the port.
      ORCH_ALLOWED_CLIENTS: ${ORCH_ALLOWED_CLIENTS:-}  # e.g. open-webui
      ORCH_ADMIN_ALLOWED_CLIENTS: ${ORCH_ADMIN_ALLOWED_CLIENTS:-}
      ORCH_TRUSTED_PROXIES: ${ORCH_TRUSTED_PROXIES:-}
    volumes:
      - oto-data:/data
    ports:
      - "${OTO_PORT:-127.0.0.1:8080}:8080"
    networks: [control, openwebui]

volumes:
  oto-data:

networks:
  control:
    internal: true
  # Attach Open WebUI to this network (or set it to Open WebUI's existing network).
  openwebui:
    name: ${OTO_WEBUI_NETWORK:-oto-webui}
