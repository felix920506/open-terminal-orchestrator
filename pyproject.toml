[project]
name = "open-terminal-orchestrator"
version = "0.1.5"
description = "Per-conversation Open Terminal sandboxes for Open WebUI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "websockets>=13",
    "aiodocker>=0.24",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "cryptography>=42",
    "pyjwt>=2.8",
    "python-multipart>=0.0.32",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
oto = "oto.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["oto"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not docker'"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["docker: requires a reachable Docker daemon and the open-terminal image"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP", "SIM"]
ignore = ["B008"]  # FastAPI's Depends() in argument defaults is the idiom
